# web 容器：静态 SPA + 反代两个后端（巡检 API 与花语 TS 智能体）
# SSE 必须 proxy_buffering off（事件流逐帧下发，ADR-0008）
server {
    listen 80;
    server_name _;

    location /api/agent {
        proxy_pass http://agent:8809;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /api/evidence {
        proxy_pass http://agent:8809;
        proxy_buffering off;
    }

    location /api {
        proxy_pass http://api:8808;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
